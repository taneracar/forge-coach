[project]
name = "forge-coach"
version = "0.1.0"
description = "Weekly training summaries for Forge users, written by Claude from statistics computed in code."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.148",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "httpx>=0.28",
    "anthropic>=1.15",
    "pyjwt[crypto]>=2.15",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "ruff>=0.17"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls the real Claude API (costs money, not run in CI)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
