name: Weekly reports

on:
  schedule:
    # Monday 12:00 UTC is already Monday from Los Angeles to Istanbul.
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  write-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the secrets below, so no other workflow can read the service-role key.
    environment: SUPABASE_URL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install .
      - name: Write last week's reports
        run: python -m app.weekly_job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
